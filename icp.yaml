networks:
  - name: local
    mode: managed
    bind: 127.0.0.1:4943

environments:
  - name: local
    network: local
    canisters:
      - counter
      - assets

canisters:
  - name: counter
    build:
      steps:
        - type: script
          commands:
            - npx ic-mops build
            - cp .mops/.build/counter.wasm "$ICP_WASM_OUTPUT_PATH"

  - name: assets
    recipe:
      type: "@dfinity/asset-canister@v2.1.0"
      configuration:
        dir: dist
